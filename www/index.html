<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quebra-Cabeça - Dinâmica Soluções em T.I</title>
<style>
  :root {
    --green: #16a34a;
    --green2: #22c55e;
    --ink: #1f2a30;
    --s: min(90vw, calc(100vh - 340px));
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #f3f6f4;
    color: var(--ink);
    font-family: sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; padding: 14px 14px 12px;
    border-bottom: 3px solid var(--green);
    background: #fff;
  }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: var(--ink); }
  h1 span { color: var(--green); }
  .sub { margin: 4px 0 0; font-size: 14px; font-weight: 700; color: var(--ink); }
  .by { margin: 2px 0 0; font-size: 12px; font-weight: 700; color: var(--green); }
  .logo {
    width: 92px; height: 92px; flex: none;
    background: #fff; border-radius: 16px;
    box-shadow: 0 2px 8px rgba(31,42,48,.2);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .logo img, .logo svg { max-width: 100%; max-height: 100%; object-fit: contain; }
  #logoFallback { display: none; width: 70px; height: 70px; }
  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
  }
  #hud { display: flex; gap: 18px; font-size: 16px; }
  #hud b { color: var(--green); }
  #board {
    position: relative;
    width: var(--s); height: var(--s);
    background: var(--ink);
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(31,42,48,.35);
    padding: 8px;
    box-sizing: content-box;
  }
  #inner { position: relative; width: 100%; height: 100%; }
  .tile {
    position: absolute;
    width: 25%; height: 25%;
    border: 3px solid transparent;
    background-clip: padding-box;
    background-image: linear-gradient(145deg, #3d4e58, #1f2a30);
    border-radius: 12px;
    color: #fff;
    font-weight: 800;
    font-size: calc(var(--s) / 8);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.18), inset 0 -3px 0 rgba(0,0,0,.35);
    transition: left .14s ease, top .14s ease, filter .15s;
    cursor: pointer;
  }
  .tile:active { filter: brightness(1.25); }
  .done .tile { background-image: linear-gradient(145deg, #22c55e, #15803d); }
  button {
    font-size: 18px; padding: 12px 30px;
    border: 0; border-radius: 12px;
    background: linear-gradient(145deg, var(--green2), var(--green));
    color: #fff; font-weight: 700;
    box-shadow: 0 3px 0 #0f7a36;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0f7a36; }
  #msg { min-height: 22px; font-size: 16px; text-align: center; padding: 0 12px; }
</style>
</head>
